<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <title>INKFLOW - 登录</title>
  <meta name="description" content="登录或注册 INKFLOW 账号，继续管理个人资料、阅读偏好、收藏内容和社区互动。">
  <meta property="og:title" content="INKFLOW - 登录">
  <meta property="og:description" content="登录 INKFLOW 账号，继续阅读文章、收藏内容并参与社区互动。">
  <meta property="og:type" content="website">
  {{> head }}
</head>
<body>

<h1 class="u-visually-hidden">登录 INKFLOW</h1>

<div class="auth-page">

  <!-- LEFT: Brand panel -->
  <div class="auth-left">
    <a href="index.html" class="auth-brand mb-4">
      INKFLOW<span class="brand-dot"></span>
    </a>
    <h2 class="auth-left-title">
      记录思考，<br>分享智慧，<br>连接世界
    </h2>
    <p class="auth-left-sub">
      加入 INKFLOW，与数千位思考者一起探索技术、设计与人文的交汇之处。
    </p>
    <ul class="auth-feature-list">
      <li><i class="bi bi-check-circle-fill" aria-hidden="true"></i> 128 篇原创深度文章</li>
      <li><i class="bi bi-check-circle-fill" aria-hidden="true"></i> 每周精选技术动态推送</li>
      <li><i class="bi bi-check-circle-fill" aria-hidden="true"></i> 收藏文章，随时回顾</li>
      <li><i class="bi bi-check-circle-fill" aria-hidden="true"></i> 参与评论，交流观点</li>
    </ul>
  </div>

  <!-- RIGHT: Form panel -->
  <div class="auth-right">

    <!-- Top nav -->
    <div class="auth-top-nav">
      <a href="index.html" class="auth-back-link">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> 返回首页
      </a>
      <button type="button" class="theme-toggle border text-success" id="themeToggle" title="切换主题" aria-label="切换深色与浅色主题">
        <i class="bi bi-moon-stars-fill" id="themeIcon" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Tab switcher (v2.0: .auth-tab-btn 替代 inline style + switchTab()) -->
    <div class="auth-tab-switcher" role="tablist" aria-label="认证方式">
      <button type="button" class="auth-tab-btn active" id="loginTab" role="tab" aria-selected="true" aria-controls="loginForm" data-auth-tab="loginForm">登录</button>
      <button type="button" class="auth-tab-btn" id="registerTab" role="tab" aria-selected="false" aria-controls="registerForm" data-auth-tab="registerForm">注册</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="auth-tab-pane" id="loginForm" role="tabpanel" aria-labelledby="loginTab">
      <div class="auth-form-title">欢迎回来</div>
      <div class="auth-form-sub">登录你的 INKFLOW 账号，继续探索</div>

      <div class="mb-3">
        <label class="auth-label" for="loginEmail">邮箱地址</label>
        <div class="ink-input-wrap has-icon-left">
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input type="email" class="ink-input ink-input-white" id="loginEmail" placeholder="your@email.com" aria-label="邮箱地址" autocomplete="email" />
        </div>
      </div>

      <div class="mb-3">
        <label class="auth-label" for="loginPassword">密码</label>
        <div class="ink-input-wrap has-icon-left">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input type="password" class="ink-input ink-input-white has-toggle" id="loginPassword" placeholder="输入密码" aria-label="密码" autocomplete="current-password" />
          <button class="auth-pwd-toggle" type="button" aria-label="显示密码" aria-controls="loginPassword" aria-pressed="false">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="auth-options">
        <label class="auth-remember" for="rememberMe">
          <input type="checkbox" id="rememberMe" aria-label="记住我" /> 记住我
        </label>
        <button type="button" class="auth-forgot" data-auth-forgot>忘记密码？</button>
      </div>

      <button class="ink-btn ink-btn-soft w-100" id="doLoginBtn" type="button">
        <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i> 登录
      </button>

      <div class="auth-divider">或通过以下方式登录</div>

      <button class="ink-btn ink-btn-white w-100 mb-3" type="button" data-demo-action data-demo-message="Google 登录需要接入 OAuth 服务">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        使用 Google 账号登录
      </button>
      <button class="ink-btn ink-btn-white w-100" type="button" data-demo-action data-demo-message="GitHub 登录需要接入 OAuth 服务">
        <i class="bi bi-github fs-6" aria-hidden="true"></i>
        使用 GitHub 账号登录
      </button>

      <div class="auth-switch">
        还没有账号？<button type="button" class="auth-switch-action" aria-controls="registerForm" data-auth-switch="registerForm">立即注册</button>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div class="auth-tab-pane d-none" id="registerForm" role="tabpanel" aria-labelledby="registerTab" hidden>
      <div class="auth-form-title">创建账号</div>
      <div class="auth-form-sub">加入 INKFLOW 社区，开始你的阅读旅程</div>

      <div class="row g-3">
        <div class="col-6">
          <div class="mb-3">
            <label class="auth-label" for="registerName">姓名</label>
            <div class="ink-input-wrap has-icon-left">
              <i class="bi bi-person" aria-hidden="true"></i>
              <input type="text" class="ink-input ink-input-white" id="registerName" placeholder="你的姓名" aria-label="姓名" autocomplete="name" />
            </div>
          </div>
        </div>
        <div class="col-6">
          <div class="mb-3">
            <label class="auth-label" for="registerUsername">用户名</label>
            <div class="ink-input-wrap has-icon-left">
              <i class="bi bi-at" aria-hidden="true"></i>
              <input type="text" class="ink-input ink-input-white" id="registerUsername" placeholder="username" aria-label="用户名" autocomplete="username" />
            </div>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="auth-label" for="registerEmail">邮箱地址</label>
        <div class="ink-input-wrap has-icon-left">
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input type="email" class="ink-input ink-input-white" id="registerEmail" placeholder="your@email.com" aria-label="注册邮箱地址" autocomplete="email" />
        </div>
      </div>

      <div class="mb-3">
        <label class="auth-label" for="registerPassword">密码</label>
        <div class="ink-input-wrap has-icon-left">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input type="password" class="ink-input ink-input-white" id="registerPassword" placeholder="至少 8 位，包含字母和数字" aria-label="注册密码" autocomplete="new-password" />
        </div>
      </div>

      <div class="auth-terms-row">
        <input type="checkbox" id="agreeTerms" />
        <label for="agreeTerms">
          我已阅读并同意 <a id="terms" href="login.html#terms">服务条款</a> 和 <a id="privacy" href="login.html#privacy">隐私政策</a>
        </label>
      </div>

      <button class="ink-btn ink-btn-soft w-100" id="doRegisterBtn" type="button">
        <i class="bi bi-person-plus me-1" aria-hidden="true"></i> 创建账号
      </button>

      <div class="auth-switch">
        已有账号？<button type="button" class="auth-switch-action" aria-controls="loginForm" data-auth-switch="loginForm">立即登录</button>
      </div>
    </div>

  </div><!-- /.auth-right -->
</div><!-- /.auth-page -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module" src="/assets/js/inkflow.js"></script>
</body>
</html>
