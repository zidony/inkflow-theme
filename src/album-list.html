<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <title>INKFLOW - 相册</title>
  <meta name="description" content="浏览 INKFLOW 相册，记录旅行、城市、自然与日常生活中的光影片段和创作者视角。">
  <meta property="og:title" content="INKFLOW - 相册">
  <meta property="og:description" content="用相册记录 INKFLOW 作者旅途、城市与生活里的精选瞬间。">
  <meta property="og:type" content="website">
  {{> head }}
</head>
<body>
<div class="reading-progress" id="readingProgress"></div>

{{> navbar }}

<!-- PAGE HERO -->
<div class="page-hero">
  <div class="container position-relative z-1">
    <nav aria-label="breadcrumb" class="ink-breadcrumb mb-3"><ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="index.html">首页</a></li>
      <li class="breadcrumb-item active">相册</li>
    </ol></nav>
    <div class="page-hero-eyebrow"><i class="bi bi-images" aria-hidden="true"></i> 视觉影像</div>
    <h1 class="page-hero-title">光影定格的瞬间</h1>
    <p class="page-hero-sub">用镜头记录旅行、城市与自然——12 个相册，340 张照片</p>
  </div>
</div>

<!-- MAIN -->
<main class="py-5" id="main-content">
  <div class="container">

    <!-- STATS BANNER -->
    <div class="stats-banner fade-up">
      <div class="text-center"><div class="stat-num">12</div><div class="stat-label">个相册</div></div>
      <div class="text-center"><div class="stat-num">340</div><div class="stat-label">张照片</div></div>
      <div class="text-center"><div class="stat-num">8</div><div class="stat-label">个城市</div></div>
      <div class="text-center"><div class="stat-num">4</div><div class="stat-label">年记录</div></div>
    </div>

    <!-- FILTER TABS -->
    <div class="filter-tabs fade-up delay-1">
      <button type="button" class="filter-tab active" data-album-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-tab" data-album-filter="travel" aria-pressed="false">旅行</button>
      <button type="button" class="filter-tab" data-album-filter="city" aria-pressed="false">城市</button>
      <button type="button" class="filter-tab" data-album-filter="nature" aria-pressed="false">自然</button>
      <button type="button" class="filter-tab" data-album-filter="life" aria-pressed="false">生活</button>
      <button type="button" class="filter-tab" data-album-filter="arch" aria-pressed="false">建筑</button>
    </div>

    <!-- FEATURED: 2 large hero albums -->
    <div class="row g-4 mb-4">
      <div class="col-md-7 fade-up delay-1">
        <button type="button" class="album-hero u-tint-green" data-lightbox-key="kyoto">
          <div class="album-hero-img">
            <i class="bi bi-tree-fill" aria-hidden="true"></i>
          </div>
          <div class="album-hero-overlay"></div>
          <div class="album-badge-top"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> 日本京都</div>
          <div class="album-badge-count"><i class="bi bi-images" aria-hidden="true"></i> 68 张</div>
          <div class="album-hero-body">
            <div class="album-hero-title">四月京都 · 樱花季</div>
            <div class="album-hero-desc">祇园白川的垂枝樱，哲学之道的粉色隧道，岚山竹林的晨雾……</div>
            <div class="album-hero-meta">
              <span class="album-meta-item"><i class="bi bi-calendar3" aria-hidden="true"></i> 2024年4月</span>
              <span class="album-meta-item"><i class="bi bi-camera2" aria-hidden="true"></i> Sony A7IV</span>
              <span class="album-meta-item"><i class="bi bi-heart-fill u-text-accent" aria-hidden="true"></i> 246</span>
            </div>
          </div>
        </button>
      </div>
      <div class="col-md-5 fade-up delay-2">
        <button type="button" class="album-hero u-tint-cyan u-h-full" data-lightbox-key="shanghai">
          <div class="album-hero-img u-h-full u-min-h-280">
            <i class="bi bi-buildings-fill" aria-hidden="true"></i>
          </div>
          <div class="album-hero-overlay"></div>
          <div class="album-badge-top"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> 上海</div>
          <div class="album-badge-count"><i class="bi bi-images" aria-hidden="true"></i> 52 张</div>
          <div class="album-hero-body">
            <div class="album-hero-title">外滩霓虹 · 城市夜色</div>
            <div class="album-hero-desc">黄浦江两岸，摩天楼与百年建筑的光影对话</div>
            <div class="album-hero-meta">
              <span class="album-meta-item"><i class="bi bi-calendar3" aria-hidden="true"></i> 2024年1月</span>
              <span class="album-meta-item"><i class="bi bi-heart-fill u-text-accent" aria-hidden="true"></i> 189</span>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- ALBUM GRID: 6 cards -->
    <p class="visually-hidden" id="albumFilterStatus" role="status" aria-live="polite">显示全部 8 个相册</p>
    <div class="row g-3 mb-5" id="albumGrid">

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-1" data-cat="travel">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-pink" data-lightbox-key="yunnan">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-flower1" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">38 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">云南大理 · 苍山洱海</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2023年10月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>142</span></div>
          </div>
        </button>
      </div>

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-2" data-cat="nature">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-green" data-lightbox-key="zhangjiajie">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-cloud-fog2-fill" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">45 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">张家界 · 云雾仙境</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2023年5月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>203</span></div>
          </div>
        </button>
      </div>

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-3" data-cat="city">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-purple" data-lightbox-key="tokyo">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-lamp-fill" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">60 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">东京 · 街头漫游</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2023年12月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>318</span></div>
          </div>
        </button>
      </div>

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-4" data-cat="arch">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-amber" data-lightbox-key="beijing">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-bank2" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">41 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">北京 · 故宫秋色</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2024年10月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>175</span></div>
          </div>
        </button>
      </div>

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-1" data-cat="life">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-blue" data-lightbox-key="daily">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-cup-hot-fill" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">28 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">咖啡馆 · 一个人的下午</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2024年8月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>97</span></div>
          </div>
        </button>
      </div>

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-2" data-cat="nature">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-cyan" data-lightbox-key="sea">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-water" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">33 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">三亚 · 海平线</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2024年2月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>224</span></div>
          </div>
        </button>
      </div>

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-3" data-cat="travel">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-orange" data-lightbox-key="dunhuang">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-sunrise-fill" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">56 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">敦煌 · 沙漠星空</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2023年7月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>387</span></div>
          </div>
        </button>
      </div>

      <div class="col-6 col-md-4 col-lg-3 fade-up delay-4" data-cat="city">
        <button type="button" class="ink-card ink-card-hover album-card u-tint-green" data-lightbox-key="chengdu">
          <div class="album-card-img-wrap">
            <div class="album-card-img"><i class="bi bi-emoji-smile-fill" aria-hidden="true"></i></div>
            <div class="album-card-hover" aria-hidden="true">
              <div class="album-card-hover-btn"><i class="bi bi-eye" aria-hidden="true"></i></div>
              <div class="album-card-hover-btn"><i class="bi bi-heart" aria-hidden="true"></i></div>
            </div>
            <div class="album-count-badge">29 张</div>
          </div>
          <div class="album-card-body">
            <div class="album-card-title">成都 · 慢生活</div>
            <div class="album-card-meta"><span><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>2023年9月</span><span><i class="bi bi-heart me-1" aria-hidden="true"></i>158</span></div>
          </div>
        </button>
      </div>

    </div>

    <!-- PHOTO MASONRY: Recent pics -->
    <div class="masonry-section mt-5 fade-up">
      <div class="masonry-header">
        <h2 class="masonry-title">近期随拍</h2>
        <span class="u-text-sm-muted">最近上传的 16 张照片</span>
      </div>
      <div class="photo-masonry" id="photoMasonry">

        <button type="button" class="photo-item u-tint-green" data-lightbox-key="p1">
          <div class="photo-ph u-h-200"><i class="bi bi-tree" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-blue" data-lightbox-key="p2">
          <div class="photo-ph u-h-280"><i class="bi bi-buildings" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-pink" data-lightbox-key="p3">
          <div class="photo-ph u-h-160"><i class="bi bi-flower2" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-amber" data-lightbox-key="p4">
          <div class="photo-ph u-h-320"><i class="bi bi-sunrise" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-purple" data-lightbox-key="p5">
          <div class="photo-ph u-h-220"><i class="bi bi-lamp" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-blue" data-lightbox-key="p6">
          <div class="photo-ph u-h-180"><i class="bi bi-water" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-green" data-lightbox-key="p7">
          <div class="photo-ph u-h-260"><i class="bi bi-cloud-fog2" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-red" data-lightbox-key="p8">
          <div class="photo-ph u-h-190"><i class="bi bi-moon-stars" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-blue" data-lightbox-key="p9">
          <div class="photo-ph u-h-240"><i class="bi bi-cup-hot" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-orange" data-lightbox-key="p10">
          <div class="photo-ph u-h-200"><i class="bi bi-bank" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-cyan" data-lightbox-key="p11">
          <div class="photo-ph u-h-300"><i class="bi bi-stars" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>
        </button>

        <button type="button" class="photo-item u-tint-green" data-lightbox-key="p12">
          <div class="photo-ph u-h-170"><i class="bi bi-tree-fill" aria-hidden="true"></i></div>
          <div class="photo-item-overlay" aria-hidden="true"><i class="bi bi-zoom-in" aria-hidden="true"></i><span>查看大图</span></div>

      </div>

  </div>
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbCaption" data-lightbox-close inert>
  <div class="lb-inner" id="lbInner">
    <button type="button" class="lb-close" aria-label="关闭图片预览" data-lightbox-close><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    <div class="lb-img" id="lbImg">
      <i class="bi bi-image u-lightbox-placeholder-icon" aria-hidden="true"></i>
    </div>
    <div class="lb-caption" id="lbCaption">四月京都 · 祇园白川的垂枝樱</div>
    <div class="lb-nav">
            <button type="button" class="lb-nav-btn" aria-label="上一张图片"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
            <button type="button" class="lb-nav-btn" aria-label="喜欢这张图片" data-demo-action data-demo-message="喜欢图片功能需要接入用户收藏或点赞 API"><i class="bi bi-heart" aria-hidden="true"></i></button>
            <button type="button" class="lb-nav-btn" aria-label="下载图片" data-demo-action data-demo-message="图片下载功能需要接入真实图片资源"><i class="bi bi-download" aria-hidden="true"></i></button>
            <button type="button" class="lb-nav-btn" aria-label="分享图片" data-demo-action data-demo-message="图片分享功能需要接入分享链接或平台 SDK"><i class="bi bi-share" aria-hidden="true"></i></button>
            <button type="button" class="lb-nav-btn" aria-label="下一张图片"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
    </div>
  </div>
</div>

<!-- FOOTER -->

{{> footer }}

{{> search }}
{{> back-to-top }}
{{> scripts }}
</body>
</html>
