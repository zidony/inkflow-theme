  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. Theme Check (Run instantly to prevent Flash of Unstyled Content) -->
  <script id="inkflow-theme-check">
    (function() {
      var savedTheme = 'light';
      try {
        savedTheme = localStorage.getItem('inkflow-theme') || 'light';
      } catch (e) {
        savedTheme = 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>

  <!-- 2. Fonts Preconnect (Both are required by Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 3. External CSS Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- 4. Main Theme CSS (Vite will replace this with inkflow.css on build) -->
  <link rel="stylesheet" href="/assets/css/main.css">
