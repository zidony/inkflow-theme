name: Automate Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Re-pushing the same tag (or a newer tag) supersedes an in-flight release run.
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Project Checks
        run: npm run check

      - name: Package Release ZIP
        run: node scripts/release.mjs

      - name: Extract Release Version & Info
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: Release ${{ steps.get_tag.outputs.TAG_NAME }}
          body: |
            ## InkFlow Theme Official Release ${{ steps.get_tag.outputs.TAG_NAME }}

            Production-ready static theme package built with **Vite**.

            Download `inkflow-theme-v*.zip` below for the pre-built template (HTML + `assets/css/inkflow.css` + `assets/js/inkflow.js`).
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            releases/inkflow-theme-*.zip
